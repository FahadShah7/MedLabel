name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/medlabel

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t medlabel:${{ github.sha }} .

      - name: Run container and wait for the healthcheck
        run: |
          docker run -d --name medlabel -p 8000:8000 medlabel:${{ github.sha }}
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' medlabel)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          [ "$status" = "healthy" ] || { docker logs medlabel; exit 1; }

      - name: Smoke test the running container
        run: |
          curl -fsS localhost:8000/health
          curl -fsS -X POST localhost:8000/predict -H "Content-Type: application/json" \
            -d '{"question": "Does aspirin reduce the risk of heart attack?"}'
          curl -fsS localhost:8000/stats

      - name: Push image to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag medlabel:${{ github.sha }} $IMAGE:sha-${GITHUB_SHA::7}
          docker push $IMAGE:sha-${GITHUB_SHA::7}
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag medlabel:${{ github.sha }} $IMAGE:${{ github.ref_name }}
            docker push $IMAGE:${{ github.ref_name }}
          else
            docker tag medlabel:${{ github.sha }} $IMAGE:latest
            docker push $IMAGE:latest
          fi
